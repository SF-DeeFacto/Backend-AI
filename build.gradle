plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}
// build.gradle
bootJar {
	mainClass.set('com.deefacto.ai_service.AiServiceApplication')
}

group = 'com.deefacto'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}


configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// AWS SDK v2 - S3
    implementation platform('software.amazon.awssdk:bom:2.20.110')
    implementation 'software.amazon.awssdk:s3'
    
    // AWS SDK v2 - Core for signing
    implementation 'software.amazon.awssdk:auth'
    implementation 'software.amazon.awssdk:http-client-spi'
    implementation 'software.amazon.awssdk:apache-client'
    
    // HTTP Client for Bedrock API
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'mysql:mysql-connector-java:8.0.33'

	// Redis 의존성
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	
	// JSON 처리
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	
	// HTTP 클라이언트
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
}

// build.gradle 파일 하단에 추가
tasks.register('printProjectName') {
	doLast {
		println project.name
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
