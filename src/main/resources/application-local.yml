spring:
  application:
    name: ai_service

#  profiles:
#    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: optional:file:C:/final_project/Backend-AI/ai_service/.env[.properties]

  datasource:
#    url: jdbc:mysql://222.235.142.221:1115/test_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#    url: jdbc:mysql://192.168.55.180:3306/test_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#    username: test01
#    password: 1234
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:dee-facto}?serverTimezone=UTC&useSSL=false&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      validation-timeout: 5000
      maximum-pool-size: 2
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # 스케줄링 설정
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: "scheduler-"

server:
  port: 8085

# 스케줄링 관련 설정
scheduler:
  enabled: true
  timezone: Asia/Seoul

# AWS Bedrock 설정
aws:
  bedrock:
    model-id: anthropic.claude-3-haiku-20240307-v1:0
    endpoint: https://bedrock-runtime.${AWS_REGION}.amazonaws.com
    # Bedrock Agent 설정 (선택사항)
    agent-id: ${AWS_BEDROCK_AGENT_ID}
    agent-alias-id: ${AWS_BEDROCK_AGENT_ALIAS_ID}

    # Threshold Bedrock Agent
    threshold-agent-id: ${AWS_THRESHOLD_BEDROCK_AGENT_ID}
    threshold-agent-alias-id: ${AWS_THRESHOLD_BEDROCK_ALIAS_ID}

  # Lambda 설정
  lambda:
    function-name: ${AWS_LAMBDA_FUNCTION_NAME}
    region: ${AWS_LAMBDA_REGION}



# AWS 인증 정보
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET:}
